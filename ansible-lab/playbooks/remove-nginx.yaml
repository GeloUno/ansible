---
- name: Remove nginx from lab servers
  hosts: lab_servers
  gather_facts: true
  become: true

  tasks:
    - name: Stop nginx
      service:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Remove nginx package
      apt:
        name: nginx
        state: absent
      when: ansible_os_family == "Debian"
